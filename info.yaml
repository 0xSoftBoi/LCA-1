# Tiny Tapeout project information for the arithmetic companion to the full SoC.
project:
  title: "Suwappu LCA-1 Arithmetic Bring-up Lane"
  author: "Suwappu Labs"
  discord: ""
  description: "Tiny dual-modulus arithmetic characterization lane accompanying the full LCA-1 SoC"
  language: "Verilog"
  clock_hz: 0  # Set only after OpenLane timing closure.
  tiles: "2x2" # Provisional until physical-design area closure.
  top_module: "tt_um_suwappu_lattice_accel"
  source_files:
    - "lca_modmul.v"
    - "lca_core.v"
    - "tt_um_suwappu_lattice_accel.v"

pinout:
  ui[0]: "data[0]"
  ui[1]: "data[1]"
  ui[2]: "data[2]"
  ui[3]: "data[3]"
  ui[4]: "data[4]"
  ui[5]: "data[5]"
  ui[6]: "data[6]"
  ui[7]: "data[7]"

  uo[0]: "read_data[0]"
  uo[1]: "read_data[1]"
  uo[2]: "read_data[2]"
  uo[3]: "read_data[3]"
  uo[4]: "read_data[4]"
  uo[5]: "read_data[5]"
  uo[6]: "read_data[6]"
  uo[7]: "read_data[7]"

  uio[0]: "reg_addr[0]"
  uio[1]: "reg_addr[1]"
  uio[2]: "reg_addr[2]"
  uio[3]: "reg_addr[3]"
  uio[4]: "write_enable"
  uio[5]: "busy"
  uio[6]: "done"
  uio[7]: "error"

yaml_version: 6
