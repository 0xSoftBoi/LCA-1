name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python3 -m compileall -q model bench tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Workload manifest smoke test
        run: python3 -m bench.bridge_profile --profile authenticated

  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile RTL
        run: iverilog -g2012 -Wall -s tb_lca_butterfly -o rtl/simv rtl/lca_modmul.sv rtl/lca_butterfly.sv rtl/tb_lca_butterfly.sv
      - name: Run RTL vectors
        run: vvp rtl/simv
