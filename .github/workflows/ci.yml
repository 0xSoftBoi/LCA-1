name: verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lca1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  model-and-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.12"
      - name: Record Python version
        run: python3 --version
      - name: Compile Python
        run: python3 -m compileall -q model bench tests tools
      - name: Validate fabrication and package release
        run: make fabrication-check
      - name: Unit and randomized differential tests
        run: python3 -m unittest discover -s tests -v
      - name: Check generated corpus drift
        run: python3 tools/gen_vectors.py --check
      - name: Workload manifest smoke test
        run: python3 -m bench.bridge_profile --profile authenticated

  license-compliance:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.12"
      - name: Install pinned REUSE tool
        run: python3 -m pip install reuse==6.2.0
      - name: REUSE specification lint
        run: reuse lint

  rtl-formal-synthesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install pinned Yosys runtime
        run: npm ci --ignore-scripts
      - name: Install RTL front-ends
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends iverilog verilator
      - name: Record host tool versions
        run: |
          mkdir -p reports
          node --version | tee reports/node-version.txt
          npm --version | tee reports/npm-version.txt
          iverilog -V > reports/iverilog-version.txt 2>&1
          verilator --version | tee reports/verilator-version.txt
      - name: Full-width generated RTL regression
        run: make rtl-test
      - name: Independent Verilator front-end gates
        run: bash verification/lint/run_lint.sh
      - name: Formal gates
        run: make formal
      - name: Generic structural synthesis
        run: make synth
      - name: Archive verification and synthesis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lca1-e1-evidence-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  fullchip-datapath-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout with pinned algorithm references
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install independent CXXRTL toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends yosys g++
      - name: Record differential-test tool versions
        run: |
          mkdir -p reports
          yosys -V | tee reports/fullchip-yosys-version.txt
          g++ --version | head -n1 | tee reports/fullchip-gxx-version.txt
      - name: NTT and Keccak differential tests against pinned PQClean
        run: make -f Makefile.fullchip test-datapaths
      - name: Archive full-chip datapath evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lca1-fullchip-datapath-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30
